[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anymodel-frontier-benchmark"
version = "1.0.0"
description = "Provider-neutral benchmark framework for models, agents, and cognitive systems"
requires-python = ">=3.10"

[project.scripts]
afb = "afb.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["afb*"]
