name: AFB CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Unit tests
        run: pytest -q
      - name: Smoke-48 oracle validation
        run: python -m afb.cli run --adapter oracle --per-domain 4 --seed 20260903 --out-dir /tmp/afb-runs
      - name: Smoke-48 weak negative control
        run: python -m afb.cli run --adapter weak --per-domain 4 --seed 20260903 --out-dir /tmp/afb-runs
